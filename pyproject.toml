[project]
name = "ckan-specnet"
version = "0.1.0"
description = "Interpretable multi-task model for MIR spectral functional-group analysis."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "polars",
    "pyarrow",
    "torch",
    "scikit-learn",
    "matplotlib",
    "ikan",
    "ruff"
]

[project.optional-dependencies]
digitization = [
    "opencv-python-headless",
    "imageio",
    "python-doctr[torch]",
]

dev = [
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ckan_specnet"]

[tool.uv]
package = true

[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
